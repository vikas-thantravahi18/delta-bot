# =====================================================================
# v2_dualtrend on BTCUSD 1h  — leg 1 of the two-strategy portfolio.
# Wallet split: this strategy manages 50% of the account.
# Risk: 5% of that 50% share per trade (= 2.5% of the full wallet).
# Runs alongside config.ut_stc_eth.yaml via scripts/run_portfolio.py.
# DRY-RUN by default — set live.dry_run: false to trade real money.
# =====================================================================

exchange:
  region: india

market:
  symbol: BTCUSD
  resolution: "1h"        # v2 is validated on 1h
  trend_resolution: "4h"  # unused (v2 computes its own trend internally)
  lot_size: 0.001         # Delta BTCUSD: 1 lot = 0.001 BTC
  min_lots: 1

account:
  starting_balance: 100.0  # fallback only; live sizing reads the API balance

risk:
  capital_allocation_pct: 0.50   # ignored while allocation_usd is set
  sizing_mode: margin
  allocation_usd: 20.0           # FLAT $20 of margin per trade, whatever the balance.
                                 # At max_leverage 10 that is $200 of notional.
                                 # Was 50% of wallet — on a $67 balance that meant
                                 # ~$33 margin and ~$335 notional, and it grew with
                                 # the account. This does not.
  risk_per_trade_usd: 3.0        # ignored in margin mode (fallback if switched to sizing_mode: risk)
  risk_per_trade_pct: null
  reward_risk_ratio: 3.0         # RR 1:3 (validated)
  max_trades_per_day: 4
  max_open_positions: 1
  max_leverage: 10
  trail_distance_r: null         # trailing OFF — trend winners need room

strategy:
  name: v2_dualtrend
  params:
    vwap_prd: 30                 # Donchian period for the VWAP trend state
    vwap_apt: 20                 # adaptive VWAP half-life (bars)
    zigzag_len: 200              # Donchian breakout length for the short side
    stop_mult: 2.0               # 2 x ATR(14) stop

backtest:
  fee_rate: 0.0005
  slippage_rate: 0.0002
  results_dir: results

live:
  dry_run: false                 # RE-ENABLED 2026-08-04. Shares the BTC slot with
                                 # ema_rsi via src/live/market_lock.py — whichever
                                 # fires first takes it, the other skips.
                                 # NOTE margin mode: 50% of wallet as margin at up
                                 # to 10x. Far more exposure per trade than the
                                 # options legs, whose loss is capped at the premium.
  poll_seconds: 60
  order_type: market_order

notify:
  enabled: true                  # coded trade alerts ON (reads TELEGRAM_BOT_TOKEN/CHAT_ID from .env)
                                 # (v2_dualtrend shows up as "One Piece"; see src/live/notifier.py)
