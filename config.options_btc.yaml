# =====================================================================
# BTC OPTIONS — "Trend Dip Sniper" on the Delta India option chain.
#
#   signal   5m BTCUSD: EMA50/200 regime + RSI(14) crossing 40 / 60
#   trade    buy the ATM option on TODAY'S expiry (call on long, put on short)
#   target   BTC +400 points -> sell to close at market
#   stop     NONE. Buying an option already caps the loss at the premium, and
#            back-testing showed an underlying stop only closed trades that
#            would have recovered (168 of them, 0 the other way).
#   size     10% of wallet per trade (percentage, NOT fixed — a fixed stake
#            cannot shrink during a losing run and tested at ~20% ruin risk)
#
# Measured on 2y of real Delta 5m candles, same-day ATM options, 2.6% spread:
#   ~41 trades/month | 69-70% win | +$18.43 per $50 staked (mid fills, 17.7% IV)
#   worst real 6-month stretch at 10%: -91% drawdown, never wiped out
#
# DRY-RUN by default. Set live.dry_run: false AND pass --live to trade real money.
# =====================================================================

exchange:
  region: india

market:
  symbol: BTCUSD
  resolution: "5m"        # signal timeframe
  trend_resolution: "1h"  # unused by this strategy
  lot_size: 0.001         # Delta BTC option contract = 0.001 BTC
  min_lots: 1

account:
  starting_balance: 150.0  # fallback + dry-run sizing; live reads the API balance

risk:
  # NOTE: options sizing is driven by strategy.params.stake_pct, NOT by this block.
  # These fields exist only because the shared Config validator (used by the three
  # perp strategies) requires them. risk_per_trade_pct is set to match stake_pct so
  # the two can never disagree in a confusing way, but the options trader reads
  # stake_pct.
  capital_allocation_pct: 1.0
  sizing_mode: risk
  risk_per_trade_usd: null
  risk_per_trade_pct: 0.10
  reward_risk_ratio: 1.0
  max_trades_per_day: 10     # cooldown removed, so THIS is now the only rate limit.
                             # Measured: busiest day fires 9 signals; a cap of 4 bit
                             # on 19.9% of days and silently dropped 112 trades.
  max_open_positions: 1
  max_leverage: 1            # buying options is not leveraged; no liquidation
  trail_distance_r: null

strategy:
  name: options_dip
  params:
    underlying: BTCUSD
    ema_fast: 50
    ema_slow: 200
    rsi_len: 14
    rsi_buy: 40.0            # cross DOWN through this in an uptrend -> buy CALL
    rsi_sell: 60.0           # cross UP through this in a downtrend -> buy PUT
    both_sides: true

    target_points: 400.0     # BTC points; +400 was the best $/trade in testing
    stake_pct: 0.10          # 10% of wallet per trade

    min_hours_to_expiry: 3.0     # skip signals inside 3h of the 12:00 UTC settlement
    close_before_expiry_min: 20  # flatten 20 min before settlement if target unhit
    cooldown_hours: 0.0          # REMOVED. Was 12h. Raises the rate from ~42 to ~74
                                 # trades/month; the ~6.4h average hold is now the
                                 # real limiter, since only one position runs at a time.
    max_iv: null                 # OFF. The strike scorer prices what each contract
                                 # would actually return, so an over-priced one loses
                                 # the ranking on its own. Set a number to re-enable.

    # --- strike selection: buy whatever moves most per BTC point ---------------
    strike_span_points: 3000.0   # search +/- 3000 from spot. Beyond that the books
                                 # go to 30-63% wide and the score collapses anyway
                                 # (65,600 call: 63.2% spread, -65% on a 400-pt move).
    score_hold_hours: 6.0        # reprice the move this far out. Measured hold with
                                 # no cooldown: mean 6.4h, median 2.9h, p90 19.2h —
                                 # heavily skewed, so the mean is the fair choice for
                                 # pricing theta into the score.

    # --- execution -------------------------------------------------------------
    # Book width measured on the live chain 2026-08-02: 1.0-1.8% near the money,
    # widening to 9% at 1500 out and 63% at 2500. An earlier reading had same-day
    # calls at 12-32%, so treat 1-2% as the CURRENT regime, not a constant — the
    # scorer prices whatever is actually quoted, so it adapts either way.
    max_spread_pct: 12.0         # a strike wider than this is dropped from scoring
    entry_order_type: market     # MARKET. Books measured 1-2% wide with ~5,000 lots
                                 # at the offer against an order of ~66, so crossing
                                 # is cheap and certain. A limit at these spreads
                                 # would need an 89-99% fill rate just to break even,
                                 # and a miss costs the whole trade, not half a
                                 # spread. Switch to `limit` if books ever widen out.
    entry_cross_pct: 0.15        # limit mode only: mid + 15% of the half-spread
    entry_fill_seconds: 45       # how long to wait for a fill before giving up
    strike_pool: 3               # unused by the scorer; kept so older configs load

backtest:
  fee_rate: 0.0005
  slippage_rate: 0.0002
  results_dir: results

live:
  dry_run: true            # DISABLED 2026-08-04. Measured +$0.06/trade over a
                           #   matched random control — statistically nothing.
                           #   Replaced by ut_stc on ETH options, which scored
                           #   +9.1 sd on the same test.
                           #   Set to false to re-enable.
  poll_seconds: 60         # 60s poll — fine for a 5m signal and a 400-pt target
  order_type: market_order

notify:
  enabled: true
