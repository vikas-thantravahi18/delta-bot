# =====================================================================
# BTC OPTIONS — "ut_stc" (UT Bot + Schaff Trend Cycle) on the BTC chain.
#
# Sister config to config.ut_stc_eth_options.yaml — same strategy, same
# engine, BTC contract specs and a BTC-sized target.
#
#   signal   4h BTCUSD: UT-Bot ATR trailing-stop flip + STC confirmation
#   trade    buy the best-scoring BTC option on TODAY'S expiry (call / put)
#   target   BTC +600 points (~0.95%) -> sell to close at market
#   stop     NONE. The premium is the maximum loss.
#   size     10% of wallet per trade
#
# WHY THIS EXISTS WHEN ut_stc's OWN DOCSTRING SAYS "dead on BTC"
#   That claim came from the PERP version. On options the economics differ,
#   and when priced correctly BTC does carry an edge. The correction was
#   large enough to be worth stating: every earlier BTC options result here
#   used an assumed IV, and every assumption was too cheap.
#
#   IV is now MEASURED, not assumed — backed out of 28,420 real historical
#   option prices pulled from Delta's own expired-contract marks (2024-02 to
#   2026-07), combined with the real term structure by hours-to-expiry
#   (0.66 at 0-4h rising to 0.85 at 20-27h against the 30-day index).
#   Median short-dated BTC IV: 34.6%.
#
#   Measured on 934 days of real Delta BTCUSD resampled to 4h, $150 wallet,
#   10% sizing, real fees, real BTC contract specs (0.001 BTC/lot, 200-pt
#   strike grid, spread curve fitted to the live chain):
#
#     11.0 trades/month | 75% win | 78% target-hit | 2.9h median hold
#     35% max drawdown  | +7.0 sd over a matched random control
#     +$2.82/trade idealised
#     +$1.97/trade after ALL FIVE stress assumptions at once (exit at bar
#              close not the target, 10% vol crush, book-depth cap, real
#              call/put skew, spreads 1.5x wider)
#     typical 1mo +32%, 3mo +137%, 6mo +426%
#
#   The matched random control LOSES $1.80/trade at this target, which is the
#   check that matters: earlier BTC frameworks showed random entries PROFITING,
#   which is how the mispricing was caught.
#
# WHY 600 AND NOT 500
#   500 is the better risk-adjusted target (+7.4 sd, 28% drawdown, +$1.72).
#   600 was chosen deliberately for more dollars per trade (+$2.82) at a
#   higher drawdown (35%). Both are defensible; 500 is the safer revert.
#
# THE MOMENTUM GATE IS DELIBERATELY NOT USED
#   The |EMA(ROC)| gate that helped 9 other strategies does NOT help ut_stc.
#   Tested across 9 variants: $/trade barely moves, median hold does not
#   improve, and significance collapses from +7.0 sd to about +3 sd because
#   the sample drops 50-85%. ut_stc is already a momentum strategy — an ATR
#   trailing-stop flip only fires when price is moving, so the gate is asking
#   a question the signal has already answered.
#
# CORRELATION WITH THE ETH LEG — READ THIS BEFORE RAISING SIZE
#   These two legs are NOT independent. 41% of BTC trades overlap an open ETH
#   trade, 60% of those in the same direction, and returns correlate +0.64
#   while overlapping. Running both at 10% is roughly 20% of the wallet on one
#   directional view: measured combined drawdown 62% against 43-46% for either
#   leg alone. Both at 5% each gives 37% drawdown for a similar return profile.
#   10% each is a deliberate choice to accept that drawdown, not a free lunch.
#
# ZERO REAL TRADES. ut_stc has never traded BTC options with real money. The
# only real BTC options record on this account is options_dip: 28 round trips,
# -$23.50, and that strategy stays disabled (it beats random by +0.2 sd).
#
# DRY-RUN by default. Needs live.dry_run: false AND --live to trade real money.
# =====================================================================

exchange:
  region: india

market:
  symbol: BTCUSD
  resolution: "4h"        # ut_stc is validated on 4h — NOT 5m
  trend_resolution: "1d"  # unused by this strategy
  lot_size: 0.001         # Delta BTC option contract = 0.001 BTC (ETH is 0.01)
  min_lots: 1

account:
  starting_balance: 150.0  # fallback + dry-run sizing; live reads the API balance

risk:
  # Options sizing comes from strategy.params.stake_pct, NOT this block. These
  # fields exist only because the shared Config validator requires them.
  capital_allocation_pct: 1.0
  sizing_mode: risk
  risk_per_trade_usd: null
  risk_per_trade_pct: 0.10
  reward_risk_ratio: 1.0
  max_trades_per_day: 4      # 4h bars cap this at 6/day; measured rate is 0.36/day
  max_open_positions: 1
  max_leverage: 1            # buying options is not leveraged; no liquidation
  trail_distance_r: null

strategy:
  name: ut_stc
  params:
    underlying: BTCUSD
    option_asset: BTC        # which option chain to fetch
    notify_as: ut_stc_btc    # Telegram cover name -> "One Piece". Without this the
                             # BTC leg would alert as "Jujutsu Kaisen", identical to
                             # the ETH leg, and the two would be indistinguishable.

    # --- ut_stc signal — IDENTICAL to the ETH leg, deliberately --------------
    # These are the ETH-tuned values. They were NOT re-fitted on BTC: tested
    # against the stock k2/z25 settings on BTC options they won at every
    # target (+7.0 sd vs +5.5 sd at 600), so the tuning transfers. Re-fitting
    # on BTC as well would be fitting twice on the same idea.
    ut_key: 1.0
    atr_period: 1
    stc_len: 80
    macd_fast: 27
    macd_slow: 50
    zone: 40.0
    flip_window: 2
    swing: 10

    target_points: 600.0     # BTC points (~0.95%). ETH's 30 is ~1.61% — the
                             # gap is deliberate: ETH realises 65.8% vol
                             # against BTC's 43.5%, so equal-percentage
                             # targets would not be equal-difficulty.
    stake_pct: 0.10

    min_hours_to_expiry: 3.0     # skip signals inside 3h of the 12:00 UTC settlement
    close_before_expiry_min: 5   # flatten 5 min before settlement if target unhit.
                                 # Measured across 60/30/20/10/5/0m: no difference
                                 # worth the name ($2.84 -> $2.83/trade, identical
                                 # 78% target-hit). Median hold is 2.9h against a
                                 # 14-24h contract, so few trades are still open
                                 # when this window matters at all.
                                 # THE TRADE-OFF IS OPERATIONAL, NOT STATISTICAL:
                                 # the bot polls every 60s, so 5 min leaves ~5
                                 # retries if a close order fails, against ~20
                                 # before. If every retry fails the option goes to
                                 # settlement, which pays intrinsic — so the real
                                 # cost is losing residual time value on an ITM
                                 # contract, not a blow-up. Raise back to 20 if you
                                 # ever see CLOSE FAILED repeating in the log.
    cooldown_hours: 0.0          # 4h bars space the trades; no extra cooldown needed
    max_iv: null                 # OFF — the strike scorer prices what each contract
                                 # would actually return, so a fixed ceiling is redundant

    # --- strike selection ---------------------------------------------------
    strike_span_points: 2000.0   # BTC grid is 200 pts, so this covers 10 strikes
                                 # either side — the same reach as the ETH leg's
                                 # 200/20. This is what the backtest scored.
    score_hold_hours: 6.0        # measured median hold 2.9h; 6h is the scoring horizon

    # --- execution ----------------------------------------------------------
    # BTC ATM spreads measured on the live chain 2026-08-05, by premium:
    # 1.3% above $800, 1.7% at $400-800, 2.3% at $200-400, 3.4% at $100-200,
    # widening to 37.6% under $10. Near-ATM depth ~$2,259 resting at the ask,
    # against the ~$7 a 10% stake buys on the current wallet.
    max_spread_pct: 12.0
    entry_order_type: market
    entry_cross_pct: 0.15        # limit mode only
    entry_fill_seconds: 45
    strike_pool: 3               # unused by the scorer; kept so older configs load

backtest:
  fee_rate: 0.0005
  slippage_rate: 0.0002
  results_dir: results

live:
  dry_run: false           # LIVE — real orders. Still gated by the --live flag
                           #        and a typed "I UNDERSTAND" at startup.
                           #        Set back to true to disable instantly.
  poll_seconds: 60
  order_type: market_order

notify:
  enabled: true
